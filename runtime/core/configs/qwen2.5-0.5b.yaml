# Qwen2.5-0.5B-Instruct runtime config
# Single source of truth for dims, dtype policy, and paths.

name: qwen2.5-0.5b-instruct
model_path: models/Qwen2.5-0.5B-Instruct

# Which production_kernels/<role>/ tree the executor uses (head_dim=64 -> draft)
kernel_set: draft

# Architecture (matches models/Qwen2.5-0.5B-Instruct/config.json)
hidden_size: 896
intermediate_size: 4864
num_hidden_layers: 24
num_attention_heads: 14
num_key_value_heads: 2
vocab_size: 151936
rms_norm_eps: 1.0e-6
rope_theta: 1000000.0
max_position_embeddings: 32768
tie_word_embeddings: true
hidden_act: silu

# Runtime policy (Quadro RTX 6000 / Turing)
dtype: fp16
accum_dtype: fp32
cuda_arch: sm_75

# Default inference limits (override at call time)
max_batch: 1
max_seq_len: 2048

# KV cache: layer-major [num_layers, batch, num_kv_heads, max_seq, head_dim]
kv_cache_layout: layer_major

# Decoder layer order (matches modeling_qwen2.Qwen2DecoderLayer)
layer_order:
  - input_rmsnorm
  - attention
  - residual_add
  - post_attn_rmsnorm
  - swiglu_mlp
  - residual_add
